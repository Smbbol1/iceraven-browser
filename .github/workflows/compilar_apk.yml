name: Compilar Iceraven APK

on:
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x gradlew

      - name: Configurar firma con llave de debug
        run: echo "autosignReleaseWithDebugKey=" >> local.properties

      - name: Compilar con Gradle
        run: ./gradlew app:assemblefenixForkRelease -PversionName="1.0.0" --stacktrace

      - name: Subir el APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Iceraven-APK
          path: app/build/outputs/apk/fenix/forkRelease/*.apk
